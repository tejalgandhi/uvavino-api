name: tests

on:
  push:
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: run test and check coverage
    steps:
      - uses: actions/checkout@v2
      - name: Cache dependencies
        uses: actions/cache@v2
        with:
          path: ~/.composer/cache/files
          key: dependencies-uvavino-composer-${{ hashFiles('composer.json') }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          extensions: mbstring, pdo, pdo_sqlite
          coverage: xdebug
      - name: Install dependencies
        run: |
          composer require "laravel/framework"  "~9.48" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction
      - name: Execute tests
        env:
          XDEBUG_MODE: coverage
          APP_KEY: base64:Y1WR7iq6v9BIQFqGIK32cN2IHGabXWh+EAmWmEloves=
        run: php artisan test --coverage --min=80
